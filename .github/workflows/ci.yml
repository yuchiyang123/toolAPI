name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore tools
        working-directory: ./blog
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore blog.sln

      - name: Check format
        working-directory: ./blog
        run: dotnet csharpier check .

      - name: Build
        run: dotnet build blog.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test blog.Tests/blog.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Docker build
        run: docker build -f blog/Dockerfile -t toolapi:ci .
